name: Contrôle des mails (lecture seule)

# Lecture seule de la boîte Yahoo (aucun mail supprimé, déplacé ni marqué comme lu).
# Déclenchement manuel uniquement : aucune planification.
on:
  workflow_dispatch:
    inputs:
      jours:
        description: "Nombre de jours à lister"
        type: string
        default: "7"
      journal:
        description: "Afficher aussi la liste dans le journal (si l'artefact ne peut pas être téléchargé)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lire la boîte Yahoo (IMAP, lecture seule)
        env:
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          JOURS: ${{ inputs.jours }}
          SORTIE: mails.json
          JOURNAL: ${{ inputs.journal }}
        run: python3 controle/mails.py
      - uses: actions/upload-artifact@v4
        with:
          name: mails
          path: mails.json
          retention-days: 1
