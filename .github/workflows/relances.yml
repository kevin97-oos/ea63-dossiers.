name: Relances assurances

on:
  schedule:
    - cron: "17 7 * * *"   # tous les jours vers 8 h 17 (heure de Paris en hiver)
  workflow_dispatch:
    inputs:
      essai:
        description: "Essai : tout afficher sans rien envoyer"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: relances
  cancel-in-progress: false

jobs:
  relancer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Relancer les dossiers non payés
        env:
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          YAHOO_APP_PASSWORD: ${{ secrets.YAHOO_APP_PASSWORD }}
          RELANCE_JOURS: "4"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.essai && '1' || '' }}
        run: python3 relances/relancer.py
      # GitHub coupe les tâches planifiées d'un dépôt sans activité pendant 60 jours :
      # une petite mise à jour le 1er du mois les garde actives.
      - name: Garder les relances actives
        if: github.event_name == 'schedule' && always()
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +"%Y-%m-%d %H:%M UTC" > relances/derniere-verification.txt
            git config user.name "Relances EA63"
            git config user.email "actions@users.noreply.github.com"
            git add relances/derniere-verification.txt
            git commit -m "Relances : vérification mensuelle" && git push || true
          fi
